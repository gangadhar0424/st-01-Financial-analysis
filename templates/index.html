<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Sentiment Analysis</title>
    <style>
        /* Google Font */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        /* Reset & Basic Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(120deg, #001f3f, #003366);
            color: white;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background */
        .background-animation {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .background-animation span {
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: move 10s infinite linear;
        }

        @keyframes move {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100vh); opacity: 0; }
        }

        /* Header */
        header {
            padding: 20px;
            font-size: 28px;
            font-weight: 600;
        }

        /* Info Section */
        .info {
            margin: 30px auto;
            width: 80%;
            font-size: 18px;
            line-height: 1.6;
        }

        /* Predict Sentiment Button */
        .predict-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background: #ffcc00;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s ease-in-out;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.8);
        }

        .predict-btn:hover {
            transform: scale(1.1);
            background: #ff9900;
        }

        /* Stock Market Ticker */
        .ticker-container {
            position: fixed;
            bottom: 20px;
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
        }

        .ticker {
            display: inline-block;
            font-size: 16px;
            animation: tickerScroll 10s linear infinite;
        }

        @keyframes tickerScroll {
            from { transform: translateX(100%); }
            to { transform: translateX(-100%); }
        }
    </style>
</head>
<body>

    <div class="background-animation"></div>

    <header>📊 Financial Sentiment Analysis</header>

    <div class="info">
        <p>Analyze market sentiment based on financial news, social media trends, and stock movements. Get real-time insights to make informed investment decisions.</p>
    </div>

    <button class="predict-btn" onclick="predictSentiment()">Predict Sentiment</button>

    <div class="ticker-container">
        <div class="ticker">💰 Bitcoin: $45,000 📈 | S&P 500: 4,500 🔺 | Gold: $1,800 📉 | NASDAQ: 14,000 📊</div>
    </div>

    <script>
        // Background Animation with Floating Elements
        function createFloatingElements() {
            const container = document.querySelector('.background-animation');
            for (let i = 0; i < 20; i++) {
                let span = document.createElement('span');
                let size = Math.random() * 15 + 5;
                span.style.width = size + 'px';
                span.style.height = size + 'px';
                span.style.left = Math.random() * 100 + 'vw';
                span.style.animationDuration = Math.random() * 5 + 5 + 's';
                container.appendChild(span);
            }
        }
        createFloatingElements();

        // Redirect to /predict when button is clicked
        function predictSentiment() {
            window.location.href = "/predict";
        }
    </script>

</body>
</html>
