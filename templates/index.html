<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Sentiment Analysis</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: black;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: relative;
        }
        .background-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        .bubble {
            position: absolute;
            bottom: -50px;
            width: 20px;
            height: 20px;
            background: gold;
            border-radius: 50%;
            opacity: 0.6;
            animation: rise 10s infinite ease-in-out;
        }
        @keyframes rise {
            0% {
                transform: translateY(0);
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh);
                opacity: 0;
            }
        }
        .spark {
            position: absolute;
            width: 5px;
            height: 5px;
            background: yellow;
            border-radius: 50%;
            opacity: 0.8;
            animation: sparkle 2s infinite;
        }
        @keyframes sparkle {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.5); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            position: relative;
            animation: zoomIn 1.5s ease-in-out;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            animation: fadeIn 2s ease-in-out;
        }
        p {
            font-size: 1.2rem;
            max-width: 600px;
            animation: fadeIn 3s ease-in-out;
        }
        .btn {
            background: gold;
            border: none;
            padding: 15px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 10px;
            transition: transform 0.3s, box-shadow 0.3s;
            animation: bounce 2s infinite;
        }
        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes zoomIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .ticker {
            position: absolute;
            width: 100%;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            color: gold;
            padding: 10px;
            white-space: nowrap;
            overflow: hidden;
        }
        .ticker div {
            display: inline-block;
            animation: tickerMove 10s linear infinite;
        }
        @keyframes tickerMove {
            from { transform: translateX(100%); }
            to { transform: translateX(-100%); }
        }
    </style>
</head>
<body>
    <div class="background-animation"></div>
    <div class="container">
        <h1>Financial Sentiment Analysis</h1>
        <p>Analyze the sentiment of financial news, tweets, and market trends in real-time.</p>
        <button class="btn" onclick="predictSentiment()">Predict Sentiment</button>
    </div>
    <div class="ticker">
        <div>Stock Market News | Bitcoin Hits New High | Federal Reserve Updates | Economic Growth Reports</div>
    </div>
    <script>
        function predictSentiment() {
            window.location.href = "/predict";
        }
        function createBubbles() {
            const bg = document.querySelector('.background-animation');
            for (let i = 0; i < 30; i++) {
                let bubble = document.createElement('div');
                bubble.classList.add('bubble');
                bubble.style.left = `${Math.random() * 100}vw`;
                bubble.style.width = `${Math.random() * 30 + 10}px`;
                bubble.style.height = bubble.style.width;
                bubble.style.animationDuration = `${Math.random() * 5 + 5}s`;
                bg.appendChild(bubble);
            }
            for (let i = 0; i < 20; i++) {
                let spark = document.createElement('div');
                spark.classList.add('spark');
                spark.style.left = `${Math.random() * 100}vw`;
                spark.style.top = `${Math.random() * 100}vh`;
                spark.style.animationDuration = `${Math.random() * 2 + 1}s`;
                bg.appendChild(spark);
            }
        }
        createBubbles();
    </script>
</body>
</html>
