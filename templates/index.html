<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Sentiment Analysis</title>
  <style>
    /* Global Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      overflow: hidden;
    }

    /* Container for the content */
    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* Heading */
    h1 {
      font-size: 4rem;
      margin-bottom: 20px;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      0% {
        text-shadow: 0 0 5px rgba(255, 154, 158, 0.8);
      }
      100% {
        text-shadow: 0 0 20px rgba(255, 154, 158, 1);
      }
    }

    /* Paragraph */
    p {
      font-size: 1.2rem;
      max-width: 600px;
      text-align: center;
      margin-bottom: 40px;
      line-height: 1.6;
      color: #ccc;
    }

    /* Predict Sentiment Button */
    .predict-btn {
      padding: 15px 30px;
      font-size: 1.2rem;
      color: #fff;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 154, 158, 0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .predict-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 20px rgba(255, 154, 158, 0.6);
    }

    /* Flying Money Animation */
    @keyframes fly {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-1000px) rotate(720deg);
        opacity: 0;
      }
    }

    .money {
      position: absolute;
      font-size: 2rem;
      color: #ffd700;
      animation: fly 5s linear infinite;
      user-select: none;
    }

    /* Background Particles Animation */
    .particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      animation: particles 5s linear infinite;
    }

    @keyframes particles {
      0% {
        transform: translateY(0) translateX(0);
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) translateX(100vw);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Financial Sentiment Analysis</h1>
    <p>
      "Analyze financial sentiment instantly! Gain insights from news, reports, and social media to make smarter market decisions."
    </p>
    <button class="predict-btn" onclick="redirectToPredict()">Predict Sentiment</button>

    <!-- Flying Money -->
    <div class="money" style="top: 10%; left: 5%;">💵</div>
    <div class="money" style="top: 20%; left: 20%;">💷</div>
    <div class="money" style="top: 30%; left: 35%;">💴</div>
    <div class="money" style="top: 40%; left: 50%;">💶</div>
    <div class="money" style="top: 50%; left: 65%;">💵</div>
    <div class="money" style="top: 60%; left: 80%;">💷</div>
    <div class="money" style="top: 70%; left: 95%;">💴</div>

    <!-- Background Particles -->
    <div class="particles">
      <div class="particle" style="top: 10%; left: 20%;"></div>
      <div class="particle" style="top: 30%; left: 50%;"></div>
      <div class="particle" style="top: 50%; left: 80%;"></div>
      <div class="particle" style="top: 70%; left: 10%;"></div>
      <div class="particle" style="top: 90%; left: 40%;"></div>
    </div>
  </div>

  <script>
    // Function to redirect to /predict
    function redirectToPredict() {
      window.location.href = "/predict";
    }

    // Generate more flying money dynamically
    const container = document.querySelector('.container');
    for (let i = 0; i < 20; i++) {
      const money = document.createElement('div');
      money.classList.add('money');
      money.innerHTML = '💵';
      money.style.top = `${Math.random() * 100}%`;
      money.style.left = `${Math.random() * 100}%`;
      money.style.animationDuration = `${Math.random() * 3 + 2}s`;
      container.appendChild(money);
    }

    // Generate more particles dynamically
    const particlesContainer = document.querySelector('.particles');
    for (let i = 0; i < 50; i++) {
      const particle = document.createElement('div');
      particle.classList.add('particle');
      particle.style.top = `${Math.random() * 100}%`;
      particle.style.left = `${Math.random() * 100}%`;
      particle.style.animationDuration = `${Math.random() * 5 + 2}s`;
      particlesContainer.appendChild(particle);
    }
  </script>
</body>
</html>
