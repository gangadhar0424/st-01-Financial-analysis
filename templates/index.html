<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Sentiment Analysis</title>
  <style>
    /* Global Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
    }

    /* Animated Background */
    @keyframes bgGlow {
      0% { background-color: #000; }
      50% { background-color: #111; }
      100% { background-color: #000; }
    }

    body {
      animation: bgGlow 5s infinite alternate;
    }

    /* Container */
    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    /* Animated Heading */
    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      text-shadow: 0px 0px 10px rgba(255, 255, 255, 0.8);
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0px 0px 10px rgba(255, 255, 255, 0.6); }
      to { text-shadow: 0px 0px 20px rgba(255, 255, 255, 1); }
    }

    /* Paragraph */
    p {
      font-size: 1.2rem;
      max-width: 600px;
      line-height: 1.6;
      color: #bbb;
      margin-bottom: 30px;
    }

    /* Predict Sentiment Button */
    .predict-btn {
      padding: 15px 30px;
      font-size: 1.2rem;
      color: #fff;
      background: linear-gradient(135deg, #ff6f61, #ff3b2f);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 111, 97, 0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: buttonGlow 2s infinite alternate;
    }

    @keyframes buttonGlow {
      from { box-shadow: 0 0 10px rgba(255, 111, 97, 0.6); }
      to { box-shadow: 0 0 20px rgba(255, 111, 97, 1); }
    }

    .predict-btn:hover {
      transform: scale(1.1);
    }

    /* Flying Money Animation */
    @keyframes fly {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
    }

    .money {
      position: absolute;
      font-size: 2rem;
      color: #ffd700;
      user-select: none;
      animation: fly linear infinite;
    }

  </style>
</head>
<body>
  <div class="container">
    <h1>Financial Sentiment Analysis</h1>
    <p>
      Welcome to the future of financial analysis! Our AI-driven sentiment analysis helps you predict market trends by analyzing financial news, social media, and more.
    </p>
    <button class="predict-btn" onclick="redirectToPredict()">Predict Sentiment</button>
  </div>

  <script>
    // Function to redirect to /predict
    function redirectToPredict() {
      window.location.href = "/predict";
    }

    // Generate floating money dynamically
    function createFlyingMoney() {
      const container = document.querySelector('.container');
      for (let i = 0; i < 20; i++) {
        const money = document.createElement('div');
        money.classList.add('money');
        money.innerHTML = ['💵', '💷', '💴', '💶'][Math.floor(Math.random() * 4)];
        money.style.top = `${Math.random() * 100}vh`;
        money.style.left = `${Math.random() * 100}vw`;
        money.style.animationDuration = `${Math.random() * 3 + 3}s`;
        money.style.animationDelay = `${Math.random() * 2}s`;
        money.style.fontSize = `${Math.random() * 2 + 1.5}rem`;
        container.appendChild(money);
      }
    }

    createFlyingMoney();
  </script>
</body>
</html>
